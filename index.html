<html lang="pt-BR">

    <style>
        :root {
            --primary: #ee4d2d;
            --primary-dark: #d03e1f;
            --bg: #f5f5f5;
            --card-bg: #ffffff;
            --text: #333333;
            --border: #e0e0e0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        h1 {
            margin: 0 0 8px 0;
            font-size: 24px;
            color: var(--primary);
        }

        .subtitle {
            color: #666;
            margin: 0 0 20px 0;
            font-size: 14px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        input[type="text"] {
            flex: 1;
            min-width: 200px;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-dark);
        }

        .options {
            margin-top: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #555;
        }

        .badge-saved {
            display: none;
            background: #e8f5e9;
            color: #2e7d32;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }

        .data-source {
            display: none;
            margin-top: 8px;
            font-size: 12px;
            color: #777;
        }

        .dot {
            height: 8px;
            width: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
        }
        .dot-live { background-color: #4caf50; }
        .dot-static { background-color: #ff9800; }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 16px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary);
        }

        .stat-card.green .stat-value { color: #2e7d32; }
        .stat-card.amber .stat-value { color: #ed6c02; }

        .stat-label {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }

        .info-banner {
            display: none;
            background: var(--card-bg);
            padding: 16px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            border-left: 5px solid var(--primary);
        }

        .info-banner.show { display: block; }

        .agency-info h2 {
            margin: 0;
            font-size: 18px;
        }

        .dop-code {
            font-size: 13px;
            color: #666;
        }

        .table-card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        .table-header {
            padding: 16px 20px;
            font-weight: bold;
            border-bottom: 1px solid var(--border);
            background: #fafafa;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }

        th, td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
        }

        th {
            background: #f0f0f0;
            color: #555;
            font-weight: 600;
        }

        tr:last-child td { border-bottom: none; }

        .pkg-code {
            font-family: monospace;
            font-weight: bold;
            background: #f0f0f0;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
        }

        .badge-green { background: #e8f5e9; color: #2e7d32; }
        .badge-amber { background: #fff3e0; color: #ed6c02; }

        .phone-link {
            color: #2e7d32;
            text-decoration: none;
            font-weight: bold;
        }

        .phone-link:hover { text-decoration: underline; }

        .no-phone { color: #999; font-style: italic; }

        .empty-state, .not-found {
            text-align: center;
            padding: 40px 20px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .empty-icon, .nf-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
    </style>
</head>

let allData = [];

async function loadData() {
    allData = EMBEDDED_DATA;
    showDataSource(false);
}

function showDataSource(isLive) {
    const ds = document.getElementById('dataSource');
    if (!ds) return;
    ds.style.display = 'block';
    ds.innerHTML = '<span class="dot dot-static"></span>Exibindo dados locais atualizados';
}

function handleSearch() {
    const input = document.getElementById('dopInput');
    const dopCode = input.value.trim();
    const remember = document.getElementById('rememberCheck').checked;
    const badge = document.getElementById('savedBadge');

    if (!dopCode) {
        showEmptyState();
        return;
    }

    if (remember) {
        localStorage.setItem('bsc_saved_dop', dopCode);
        if (badge) badge.style.display = 'inline-flex';
    } else {
        localStorage.removeItem('bsc_saved_dop');
        if (badge) badge.style.display = 'none';
    }

    renderResults(dopCode);
}

function renderResults(dopCode) {
    const resultsDiv = document.getElementById('results');
    
    const matches = allData.filter(row => row[0] && row[0].toString().trim() === dopCode);

    if (matches.length === 0) {
        resultsDiv.innerHTML = `
            <div class="not-found">
                <div class="nf-icon">⚠️</div>
                <h3>Nenhum pacote encontrado</h3>
                <p>Não encontramos pendências ativas para o código DOP <strong>${escapeHtml(dopCode)}</strong>.</p>
            </div>
        `;
        return;
    }

    const agencyName = matches[0][1] || 'Agência não identificada';
    const totalPackages = matches.length;
    
    let withPhone = 0;
    let searchingPhone = 0;

    matches.forEach(row => {
        const phone = row[5] ? row[5].trim() : '';
        if (phone && phone.length > 5) {
            withPhone++;
        } else {
            searchingPhone++;
        }
    });

    let html = `
        <div class="info-banner show">
            <div class="agency-info">
                <h2>${escapeHtml(agencyName)}</h2>
                <span class="dop-code">Código DOP: <strong>${escapeHtml(dopCode)}</strong></span>
            </div>
        </div>

        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-value">${totalPackages}</div>
                <div class="stat-label">Total Pacotes</div>
            </div>
            <div class="stat-card green">
                <div class="stat-value">${withPhone}</div>
                <div class="stat-label">Com Telefone</div>
            </div>
            <div class="stat-card amber">
                <div class="stat-value">${searchingPhone}</div>
                <div class="stat-label">Sem Telefone</div>
            </div>
        </div>

        <div class="table-card">
            <div class="table-header">
                📋 Lista de Pacotes Pendentes (${totalPackages})
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Pacote</th>
                            <th>Comprador</th>
                            <th>Status / Motivo</th>
                            <th>Telefone Contato</th>
                            <th>Ação Recomendada</th>
                        </tr>
                    </thead>
                    <tbody>
    `;

    matches.forEach(row => {
        const pkg = row[2] || '-';
        const buyer = row[3] || '-';
        const status = row[4] || '-';
        const phone = row[5] ? row[5].trim() : '';
        const action = row[6] || '-';

        let phoneHtml = `<span class="no-phone">Indisponível</span>`;
        let statusBadge = `<span class="badge badge-amber">Aguardando</span>`;

        if (phone && phone.length > 5) {
            const cleanPhone = phone.replace(/\D/g, '');
            phoneHtml = `<a href="https://wa.me/${cleanPhone}" target="_blank" class="phone-link">📱 ${escapeHtml(phone)}</a>`;
            statusBadge = `<span class="badge badge-green">Contato Disponível</span>`;
        }

        html += `
            <tr>
                <td><span class="pkg-code">${escapeHtml(pkg)}</span></td>
                <td><strong>${escapeHtml(buyer)}</strong></td>
                <td>${statusBadge}<br><small style="color:#666">${escapeHtml(status)}</small></td>
                <td>${phoneHtml}</td>
                <td><small>${escapeHtml(action)}</small></td>
            </tr>
        `;
    });

    html += `
                    </tbody>
                </table>
            </div>
        </div>
    `;

    resultsDiv.innerHTML = html;
}

function showEmptyState() {
    const resultsDiv = document.getElementById('results');
    if (!resultsDiv) return;
    resultsDiv.innerHTML = `
        <div class="empty-state">
            <div class="empty-icon">🔍</div>
            <h3>Digite seu Código DOP</h3>
            <p>Informe o código da sua DOP para visualizar os pacotes sob sua gestão.</p>
        </div>
    `;
}

function escapeHtml(text) {
    if (!text) return '';
    return text
        .toString()
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

document.addEventListener('DOMContentLoaded', async () => {
    const input = document.getElementById('dopInput');
    const badge = document.getElementById('savedBadge');
    
    if (input) {
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSearch();
        });
    }

    await loadData();

    const savedDop = localStorage.getItem('bsc_saved_dop');
    if (savedDop && input) {
        input.value = savedDop;
        if (badge) badge.style.display = 'inline-flex';
        renderResults(savedDop);
    }
});
</script>
