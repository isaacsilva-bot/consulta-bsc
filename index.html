// Global data array
let allData = [];
let isLiveData = false;

// Google Sheets CSV Export URL
const SHEETS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vREUvMhG1fJ1N59XvXk8h0qSg/pub?output=csv';

async function loadData() {
    try {
        const response = await fetch(SHEETS_CSV_URL);
        if (response.ok) {
            const csvText = await response.text();
            allData = parseCSV(csvText);
            // Ignore header row if present
            if (allData.length > 0 && allData[0][0].toLowerCase().includes('código')) {
                allData.shift();
            }
            isLiveData = true;
            showDataSource(true);
            return;
        }
    } catch (err) {
        console.warn('Falha ao carregar Google Sheets, utilizando EMBEDDED_DATA:', err);
    }

    // Fallback: use embedded data
    allData = EMBEDDED_DATA;
    isLiveData = false;
    showDataSource(false);
}

function parseCSV(text) {
    const lines = text.split('\n');
    return lines.map(line => {
        let values = [];
        let insideQuote = false;
        let currentValue = '';
        
        for (let i = 0; i < line.length; i++) {
            const char = line[i];
            if (char === '"') {
                insideQuote = !insideQuote;
            } else if (char === ',' && !insideQuote) {
                values.push(currentValue.trim().replace(/^"|"$/g, ''));
                currentValue = '';
            } else {
                currentValue += char;
            }
        }
        values.push(currentValue.trim().replace(/^"|"$/g, ''));
        return values;
    });
}

function showDataSource(isLive) {
    const ds = document.getElementById('dataSource');
    if (!ds) return;
    ds.style.display = 'block';
    if (isLive) {
        ds.innerHTML = '<span class="dot dot-live"></span>Dados atualizados em tempo real (Google Sheets)';
    } else {
        ds.innerHTML = '<span class="dot dot-static"></span>Exibindo dados locais (Modo Offline)';
    }
}

    const dopCode = input.value.trim();
    const remember = document.getElementById('rememberCheck').checked;
    const badge = document.getElementById('savedBadge');

    if (!dopCode) {
        showEmptyState();
        return;
    }

    if (remember) {
        localStorage.setItem('bsc_saved_dop', dopCode);
        if (badge) badge.style.display = 'inline-flex';
    } else {
        localStorage.removeItem('bsc_saved_dop');
        if (badge) badge.style.display = 'none';
    }

    renderResults(dopCode);
}

function renderResults(dopCode) {
    const resultsDiv = document.getElementById('results');
    
    // Filter matching rows (Column 0 is DOP Code)
    const matches = allData.filter(row => row[0] && row[0].toString().trim() === dopCode);

    if (matches.length === 0) {
        resultsDiv.innerHTML = `
            <div class="not-found">
                <div class="nf-icon">⚠️</div>
                <h3>Nenhum pacote encontrado</h3>
                <p>Não encontramos pendências ativas para o código DOP <strong>${escapeHtml(dopCode)}</strong>.</p>
            </div>
        `;
        return;
    }

    const agencyName = matches[0][1] || 'Agência não identificada';
    const totalPackages = matches.length;
    
    // Count stats based on phone availability (Column 5)
    let withPhone = 0;
    let searchingPhone = 0;

    matches.forEach(row => {
        const phone = row[5] ? row[5].trim() : '';
        if (phone && phone.length > 5) {
            withPhone++;
        } else {
            searchingPhone++;
        }
    });

    let html = `
        <div class="info-banner show">
            <div class="agency-info">
                <div class="agency-icon">🏢</div>
                <div class="agency-details">
                    <h2>${escapeHtml(agencyName)}</h2>
                    <span class="dop-code">Código DOP: <strong>${escapeHtml(dopCode)}</strong></span>
                </div>
            </div>
        </div>

        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-value">${totalPackages}</div>
                <div class="stat-label">Total Pacotes</div>
            </div>
            <div class="stat-card green">
                <div class="stat-value">${withPhone}</div>
                <div class="stat-label">Com Telefone</div>
            </div>
            <div class="stat-card amber">
                <div class="stat-value">${searchingPhone}</div>
                <div class="stat-label">Em Busca</div>
            </div>
        </div>

        <div class="table-card">
            <div class="table-header">
                📋 Lista de Pacotes Pendentes (${totalPackages})
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Pacote</th>
                            <th>Comprador</th>
                            <th>Status / Motivo</th>
                            <th>Telefone Contato</th>
                            <th>Ação Recomendada</th>
                        </tr>
                    </thead>
                    <tbody>
    `;

    matches.forEach(row => {
        const pkg = row[2] || '-';
        const buyer = row[3] || '-';
        const status = row[4] || '-';
        const phone = row[5] ? row[5].trim() : '';
        const action = row[6] || '-';

        let phoneHtml = `<span class="no-phone">Indisponível</span>`;
        let statusBadge = `<span class="badge badge-amber">Aguardando</span>`;

        if (phone && phone.length > 5) {
            const cleanPhone = phone.replace(/\D/g, '');
            phoneHtml = `<a href="https://wa.me/${cleanPhone}" target="_blank" class="phone-link">📱 ${escapeHtml(phone)}</a>`;
            statusBadge = `<span class="badge badge-green">Contato Disponível</span>`;
        }

        html += `
            <tr>
                <td><span class="pkg-code">${escapeHtml(pkg)}</span></td>
                <td><strong>${escapeHtml(buyer)}</strong></td>
                <td>${statusBadge}<br><small style="color:#666">${escapeHtml(status)}</small></td>
                <td>${phoneHtml}</td>
                <td><small>${escapeHtml(action)}</small></td>
            </tr>
        `;
    });

    html += `
                    </tbody>
                </table>
            </div>
        </div>
    `;

    resultsDiv.innerHTML = html;
}

function showEmptyState() {
    const resultsDiv = document.getElementById('results');
    if (!resultsDiv) return;
    resultsDiv.innerHTML = `
        <div class="empty-state">
            <div class="empty-icon">🔍</div>
            <h3>Digite seu Código DOP</h3>
            <p>Informe o código da sua DOP para visualizar os pacotes sob sua gestão.</p>
        </div>
    `;
}

function escapeHtml(text) {
    if (!text) return '';
    return text
        .toString()
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

// ============================================================
// INITIALIZATION
// ============================================================
document.addEventListener('DOMContentLoaded', async () => {
    const input = document.getElementById('dopInput');
    const badge = document.getElementById('savedBadge');
    
    // Support enter key on input
    if (input) {
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSearch();
        });
    }

    // Load Data
    await loadData();

    // Check saved DOP in LocalStorage
    const savedDop = localStorage.getItem('bsc_saved_dop');
    if (savedDop && input) {
        input.value = savedDop;
        if (badge) badge.style.display = 'inline-flex';
        renderResults(savedDop);
    }
});
</script>
</body>
</html>
